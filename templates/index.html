<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Flask CI/CD Demo</title>
</head>
<body>
  <h1>Flask CI/CD Demo</h1>

  <button id="alert-btn">Click me</button>

  <script>
    const btn = document.getElementById("alert-btn");
    btn.addEventListener("click", () => {
      alert("Hello from CI/CD frontend!");
    });
  </script>
</body>
</html>
